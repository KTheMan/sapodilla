<!DOCTYPE html>
<html lang="en">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff2daa" />
    <title>Sapodilla</title>
    <!-- Trunk replaces this at the same position with the content-addressed
         application module. The following bootstrap uses that hash as the
         revision for every stable PWA/worker URL. -->
    <link data-trunk rel="rust" data-wasm-opt="2" data-bindgen-target="web" />
    <script>
      // GitHub Pages cannot configure COOP/COEP response headers. Install a
      // same-origin service worker before starting the threaded WASM build;
      // its first activation reloads this page under cross-origin isolation.
      if ("serviceWorker" in navigator) {
        const moduleSource =
          document.querySelector('script[type="module"]')?.textContent || "";
        const buildRevision =
          moduleSource.match(/sapodilla-([a-f0-9]+)\.js/)?.[1] || "development";
        const needsIsolation = !window.crossOriginIsolated;
        const showStartupError = () => {
          const show = () => {
            const loading = document.getElementById("loading_text");
            if (loading) {
              loading.innerHTML =
                "<p style='font-size: 16px'>Sapodilla could not start. Reload the page or use a current Chromium browser.</p>";
            }
          };
          if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", show, { once: true });
          } else {
            show();
          }
        };
        const workerUrl = new URL("coi-serviceworker.js", document.baseURI);
        workerUrl.searchParams.set("build", buildRevision);
        const startupTimeout = window.setTimeout(showStartupError, 10000);
        let controllerReloadStarted = false;
        navigator.serviceWorker.addEventListener("controllerchange", () => {
          if (controllerReloadStarted) {
            return;
          }
          controllerReloadStarted = true;
          window.clearTimeout(startupTimeout);
          window.location.reload();
        });
        navigator.serviceWorker
          .register(workerUrl.href, { scope: "./", updateViaCache: "none" })
          .then(() => {
            if (!navigator.serviceWorker.controller) {
              // The controllerchange handler reloads as soon as this build's
              // worker claims the page.
              return;
            } else if (
              needsIsolation &&
              sessionStorage.getItem("sapodilla-coi-reload") !== "1"
            ) {
              sessionStorage.setItem("sapodilla-coi-reload", "1");
              window.location.reload();
            } else {
              window.clearTimeout(startupTimeout);
              if (window.crossOriginIsolated) {
                sessionStorage.removeItem("sapodilla-coi-reload");
              } else if (needsIsolation) {
                showStartupError();
              }
            }
          })
          .catch(() => {
            window.clearTimeout(startupTimeout);
            showStartupError();
          });
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff2daa'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='sans-serif' font-size='20' fill='%230b0b10'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icons/sapodilla-192.png" />

    <link data-trunk rel="copy-file" href="static/_headers" />
    <link data-trunk rel="copy-file" href="static/coi-serviceworker.js" />
    <link data-trunk rel="copy-file" href="static/calibration-worker.js" />
    <link data-trunk rel="copy-file" href="static/manifest.webmanifest" />
    <link data-trunk rel="copy-dir" href="static/icons" />

    <base data-trunk-public-url />

    <style>
      html {
        touch-action: manipulation;
      }

      body {
        background: #909090;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #404040;
        }
      }

      html,
      body {
        overflow: hidden;
        margin: 0 !important;
        padding: 0 !important;
        height: 100%;
        width: 100%;
      }

      canvas {
        margin-right: auto;
        margin-left: auto;
        display: block;
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }

      .centered {
        margin-right: auto;
        margin-left: auto;
        display: block;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #f0f0f0;
        font-size: 24px;
        font-family: Ubuntu-Light, Helvetica, sans-serif;
        text-align: center;
      }

      .lds-dual-ring {
        display: inline-block;
        width: 24px;
        height: 24px;
      }

      .lds-dual-ring:after {
        content: " ";
        display: block;
        width: 24px;
        height: 24px;
        margin: 0px;
        border-radius: 50%;
        border: 3px solid #fff;
        border-color: #fff transparent #fff transparent;
        animation: lds-dual-ring 1.2s linear infinite;
      }

      @keyframes lds-dual-ring {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <canvas
      id="sapodilla_canvas"
      tabindex="0"
      aria-label="Sapodilla sticker sheet editor"
    ></canvas>

    <div class="centered" id="loading_text">
      <p style="font-size: 16px">Loading</p>
      <div class="lds-dual-ring"></div>
    </div>
  </body>
</html>
