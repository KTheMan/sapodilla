name: CI

on:
  push:

env:
  RUST_NIGHTLY_VERSION: "nightly-2026-03-17"

jobs:
  check:
    name: Clippy
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [x86_64-unknown-linux-gnu, wasm32-unknown-unknown]
        features: [none]
        include:
          - target: wasm32-unknown-unknown
            features: web-workers

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Prepare Rust
        run: "./scripts/prepare-${{ matrix.target }}_${{ matrix.features }}.sh"

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Run clippy with default features
        if: ${{ matrix.features == 'none' }}
        run: |
          cargo clippy --all-targets --target ${{ matrix.target }}

      - name: Run clippy with custom features
        if: ${{ matrix.features != 'none' }}
        run: |
          cargo clippy --all-targets --target ${{ matrix.target }} --features ${{ matrix.features }}

  test:
    name: Run tests
    runs-on: ubuntu-latest

    env:
      RUSTFLAGS: "-Dwarnings"

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Linux dependencies
        run: sudo apt-get update && sudo apt-get install --yes libdbus-1-dev pkg-config

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"

      - name: Check format
        run: cargo fmt --check

      - name: Run tests
        run: cargo test
