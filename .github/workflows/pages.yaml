name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  RUST_NIGHTLY_VERSION: "nightly-2026-03-17"

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_NIGHTLY_VERSION }}
          targets: wasm32-unknown-unknown
          components: rust-src

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Install Trunk
        uses: taiki-e/install-action@v2
        with:
          tool: trunk

      - name: Build project site
        run: ./scripts/build-wasm32-unknown-unknown_web-workers.sh --public-url /sapodilla/

      - name: Verify installable app assets
        run: |
          test -f dist/manifest.webmanifest
          test -f dist/coi-serviceworker.js
          test -f dist/icons/sapodilla-192.png
          test -f dist/icons/sapodilla-512.png
          grep -q 'rel="manifest"' dist/index.html

      - name: Test browser persistence and cache ownership
        run: node --test tests/web_persistence.test.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
