[package]
name = "sapodilla"
version = "0.1.0"
edition = "2024"
publish = false
authors = ["Syfaro <syfaro@huefox.com>"]

[features]
web-workers = ["wasm_thread"]

[dependencies]
anyhow = "1.0.99"
async-trait = "0.1.89"
byteorder = "1.5.0"
derive_more = { version = "2.0.1", features = ["debug"] }
eframe = { version = "0.33.3", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "glow",
] }
egui = "0.33.3"
egui_dnd = "0.14.0"
egui_extras = { version = "0.33.3", features = ["image", "syntect"] }
enum_dispatch = "0.3.13"
futures = "0.3"
geo = { version = "0.32.0", default-features = false }
hex = "0.4.3"
hex-literal = "1"
image = { version = "0.25.8", default-features = false, features = ["jpeg", "png"] }
imageproc = { version = "0.26.1", default-features = false }
itertools = "0.14.0"
lazy_static = "1.5.0"
oneshot = { version = "0.2.1", features = ["async"] }
packed_struct = "0.10"
rfd = "0.17.2"
serde = { version = "1.0.222", features = ["derive"] }
serde_json = "1.0.145"
serde_plain = "1.0.2"
sha1 = "0.10.6"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tracing = "0.1"
web-sys = { version = "0.3", features = [
    "Serial",
    "SerialPort",
    "SerialPortInfo",
    "SerialOptions",
    "ReadableStream",
    "ReadableStreamDefaultReader",
    "Performance",
    "WritableStream",
    "WritableStreamDefaultWriter",
    "Window",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.47.1", default-features = false, features = [
    "rt",
    "rt-multi-thread",
    "macros",
    "time",
] }
tokio-stream = { version = "0.1.17", features = ["time"] }
tracing-subscriber = "0.3"
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.2.17", features = ["js"] }
gloo-timers = { version = "0.3", features = ["futures"] }
uuid = { version = "1.18.1", features = ["v4", "js"] }
wasm_thread = { version = "0.3.3", optional = true }
wasm-bindgen-futures = "0.4.50"
wasm-tracing = "2.1.0"

[profile.release]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2

[patch.crates-io]
geo = { git = "https://github.com/georust/geo.git", rev = "a1a85968749b3589655776638b422a88727197ae" }
geo-types = { git = "https://github.com/georust/geo.git", rev = "a1a85968749b3589655776638b422a88727197ae" }
